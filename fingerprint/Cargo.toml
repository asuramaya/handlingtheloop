[package]
name = "htl-fingerprint"
version = "0.0.1"
edition = "2021"
description = "Chromaprint (AcoustID-compatible) fingerprint of decoded PCM, compiled to wasm."

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
rusty-chromaprint = "0.3"
base64 = "0.22"

[profile.release]
opt-level = "z"
lto = true
panic = "abort"
strip = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
